name: Release installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile arp_poisoning_detector.py
      - name: Parser smoke test
        run: python -c "from arp_poisoning_detector import parse_arp_table; assert parse_arp_table('192.0.2.1 aa:bb:cc:dd:ee:ff dynamic')"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyinstaller
      - run: pyinstaller --clean --onefile --name arp-poisoning-detector arp_poisoning_detector.py
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" packaging\windows\arp-poisoning-detector.iss
      - uses: actions/upload-artifact@v7
        with:
          name: arp-poisoning-detector-windows
          path: artifacts/*.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyinstaller
      - run: pyinstaller --clean --onefile --name arp-poisoning-detector arp_poisoning_detector.py
      - name: Build pkg
        run: |
          mkdir -p package-root/usr/local/bin artifacts
          install -m 755 dist/arp-poisoning-detector package-root/usr/local/bin/arp-poisoning-detector
          pkgbuild --root package-root --identifier com.yourfoxprodeveloper.arp-poisoning-detector --version "$APP_VERSION" "artifacts/arp-poisoning-detector-${APP_VERSION}-macos-${{ matrix.arch }}.pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: arp-poisoning-detector-macos-${{ matrix.arch }}
          path: artifacts/*.pkg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyinstaller
      - run: pyinstaller --clean --onefile --name arp-poisoning-detector arp_poisoning_detector.py
      - name: Build deb and rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev rpm
          sudo gem install --no-document fpm
          mkdir -p package-root/usr/bin artifacts
          install -m 755 dist/arp-poisoning-detector package-root/usr/bin/arp-poisoning-detector
          fpm -s dir -t deb -n arp-poisoning-detector -v "$APP_VERSION" -C package-root -p "artifacts/arp-poisoning-detector_${APP_VERSION}_amd64.deb" .
          fpm -s dir -t rpm -n arp-poisoning-detector -v "$APP_VERSION" -C package-root -p "artifacts/arp-poisoning-detector-${APP_VERSION}-1.x86_64.rpm" .
      - uses: actions/upload-artifact@v7
        with:
          name: arp-poisoning-detector-linux
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: arp-poisoning-detector-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
